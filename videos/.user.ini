; Per-directory PHP limits for the video uploader. Honored on FastCGI/PHP-FPM
; shared hosting (most cPanel hosts). If your host runs mod_php instead, set
; these in the hosting control panel or php.ini — otherwise uploads are capped
; at the host default (often 2-8M) regardless of the app's 128M setting.
upload_max_filesize = 128M
post_max_size = 130M
max_execution_time = 120
memory_limit = 256M
